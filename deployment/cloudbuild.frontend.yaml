# deployment/cloudbuild.frontend.yaml
# Build the standalone frontend with the public Cloud Run API origin.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_API_BASE_URL=${_API_BASE_URL}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}
      - --tag
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _API_BASE_URL: https://replace-with-backend.example
  _IMAGE: us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/cultural-reference-web:latest
  _FIREBASE_API_KEY: replace-with-firebase-web-api-key
  _FIREBASE_AUTH_DOMAIN: replace-with-firebase-auth-domain
  _FIREBASE_PROJECT_ID: replace-with-firebase-project-id
